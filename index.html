<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FileOS 1.3</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1a2335">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{--bg:#1a2335;--card:#252d42;--text:#fff;--dim:#8892a8;--acc:#0099ff;--ok:#23c867;--warn:#ff9500;--bad:#ff3b30}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;padding-bottom:env(safe-area-inset-bottom)}
header{display:flex;align-items:center;gap:8px;padding:14px 16px 6px}
h1{font-size:19px;margin:0;flex:1}
button{border:0;border-radius:10px;background:var(--card);color:var(--text);padding:9px 14px;font-size:13px;font-weight:600}
button.pri{background:linear-gradient(135deg,#0099ff,#20a9ff)}
#status{padding:0 16px 8px;color:var(--dim);font-size:12px;line-height:1.5;white-space:pre-line}
.row{display:flex;gap:8px;overflow-x:auto;padding:6px 12px;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:7px 14px;border-radius:14px;background:var(--card);color:var(--dim);font-size:13px;font-weight:600}
.chip.on{background:linear-gradient(135deg,#0099ff,#20a9ff);color:#fff}
main{padding:4px 12px 24px}
.item{background:var(--card);border-radius:12px;padding:12px;margin:8px 0}
.t{font-size:15px;font-weight:700}
.s{font-size:12px;color:var(--dim);margin-top:3px}
.empty{color:var(--dim);text-align:center;padding:30px 0;font-size:14px}
dialog{border:0;border-radius:16px;background:var(--card);color:var(--text);padding:18px;width:92%;max-width:420px}
dialog::backdrop{background:rgba(0,0,0,.6)}
input{width:100%;padding:11px;border-radius:10px;border:0;background:#1a2335;color:#fff;font-size:14px;margin:8px 0}
label{font-size:12px;color:var(--dim);display:block;margin-top:10px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
</style>
</head>
<body>
<header>
  <h1>FileOS <span style="font-size:12px;opacity:.6;font-weight:400">1.3</span></h1>
  <button id="btnRefresh">刷新</button>
  <button id="btnSet">设置</button>
</header>
<div id="status">尚未读取数据 · 点「设置」粘贴 Gist 链接</div>
<div class="row" id="classRow"></div>
<div class="row" id="tabRow"></div>
<div class="row" id="subjRow" style="display:none"></div>
<main id="list"><div class="empty">暂无数据</div></main>

<dialog id="dlg">
  <b>设置</b>
  <label>Gist 链接（https://gist.github.com/用户名/ID）</label>
  <input id="inLink" placeholder="https://gist.github.com/..." autocapitalize="off" autocorrect="off">
  <label>或直接从本地导入 JSON 文件</label>
  <input id="inFile" type="file" accept=".json,application/json">
  <div class="btns">
    <button class="pri" id="btnSaveLink">保存并用链接读取</button>
    <button id="btnClear">清除缓存</button>
    <button id="btnClose">关闭</button>
  </div>
</dialog>

<script>
const CLASSES=['初三9班','初三10班'];
const TABS=['排行榜','学生','小组','商城','明细'];
const SUBJECTS=['全部','语文','数学','英语','物理','化学','生物','政治','历史','地理','体育','美术','音乐','信息','不选科'];
const KEY_LINK='fileos-m-link', KEY_CLASS='fileos-m-class', KEY_CACHE='fileos-m-cache';
let curClass=localStorage.getItem(KEY_CLASS)||CLASSES[0];
let tab=0, subject='全部', data=null, source='';

const $=id=>document.getElementById(id);
const toast=m=>{ $('status').textContent=m; };

function renderChips(box, items, active, onPick){
  box.innerHTML='';
  items.forEach(x=>{
    const b=document.createElement('div');
    b.className='chip'+(x===active?' on':'');
    b.textContent=x;
    b.onclick=()=>onPick(x);
    box.appendChild(b);
  });
}

function totals(){
  const t={};
  (data.names||[]).forEach(n=>t[n]=0);
  (data.scores||[]).forEach(s=>{ t[s.who]=(t[s.who]||0)+s.num; });
  return t;
}
function idOf(name){
  const sm=data.studentMap||{};
  for(const k in sm) if(sm[k]===name) return k;
  return '—';
}
function groupMembers(g){
  const i=Math.max(g.indexOf('：'),g.indexOf(':'));
  const name=i>0?g.slice(0,i):g;
  const ms=i>0?g.slice(i+1).trim().split(/\s+/).filter(Boolean):[];
  return {name,ms};
}

function render(){
  renderChips($('classRow'), CLASSES, curClass, c=>{ curClass=c; localStorage.setItem(KEY_CLASS,c); render(); });
  renderChips($('tabRow'), TABS, TABS[tab], t=>{ tab=TABS.indexOf(t); render(); });
  $('subjRow').style.display = tab===4 ? 'flex' : 'none';
  renderChips($('subjRow'), SUBJECTS, subject, s=>{ subject=s; render(); });

  const box=$('list');
  if(!data || !(data.names||[]).length){
    box.innerHTML='<div class="empty">暂无数据<br>点右上「设置」粘贴 Gist 链接</div>';
    return;
  }
  const t=totals();
  let html='';
  if(tab===0){
    Object.entries(t).sort((a,b)=>b[1]-a[1]).forEach(([n,v],i)=>{
      html+='<div class="item"><div class="t">'+(i+1)+'. '+n+' &nbsp;'+v+' 分</div><div class="s">第 '+(i+1)+' 名</div></div>';
    });
  } else if(tab===1){
    const names=(data.names||[]).slice();
    names.forEach(n=>{
      html+='<div class="item"><div class="t">'+n+'</div><div class="s">学号 '+idOf(n)+' · 总分 '+(t[n]||0)+' 分</div></div>';
    });
  } else if(tab===2){
    (data.customGroups||[]).forEach(g=>{
      const {name,ms}=groupMembers(g);
      const sum=ms.reduce((a,m)=>a+(t[m]||0),0);
      html+='<div class="item"><div class="t">'+name+' &nbsp;总分 '+sum+' 分</div><div class="s">'+ms.length+' 人：'+ms.join(' ')+'</div></div>';
    });
  } else if(tab===3){
    (data.goodsList||[]).forEach(g=>{
      html+='<div class="item"><div class="t">'+g.name+'</div><div class="s">'+g.price+' 分</div></div>';
    });
    (data.buyRecords||[]).forEach(b=>{
      html+='<div class="item"><div class="t">'+b.user+' 购买 '+b.goods+'（-'+b.price+' 分）</div><div class="s">'+b.time+(b.buyer?' · '+b.buyer:'')+'</div></div>';
    });
  } else {
    const list=(data.scores||[]).filter(s=>subject==='全部'||(s.subject||'不选科')===subject)
      .sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));
    list.forEach(s=>{
      const sign=s.num>=0?'+':'';
      html+='<div class="item"><div class="t" style="color:'+(s.num>=0?'var(--ok)':'var(--bad)')+'">'+s.who+' &nbsp;'+sign+s.num+' 分</div><div class="s">'+s.type+' · '+(s.subject||'不选科')+' · '+s.date+' '+s.time+'</div></div>';
    });
  }
  box.innerHTML = html || '<div class="empty">暂无记录</div>';
  toast('来源：'+(source||'本地缓存')+' · 学生 '+(data.names||[]).length+' 人 · 记录 '+(data.scores||[]).length+' 条 · 班级 '+curClass);
}

function applyJson(raw, src){
  try{
    const root=JSON.parse(raw);
    data=root.data||root;
    source=src||'';
    if(root.class && CLASSES.indexOf(root.class)>=0) curClass=root.class;
    localStorage.setItem(KEY_CLASS,curClass);
    localStorage.setItem(KEY_CACHE,JSON.stringify({class:curClass,data:data}));
    render();
    if(root.class && root.class!==curClass) toast('备份属于「'+root.class+'」，已提示切换');
  }catch(e){ toast('数据格式错误：'+e.message); }
}

function rawUrlFrom(link){
  link=link.trim();
  if(link.indexOf('gist.githubusercontent.com')>=0) return link;
  const m=link.match(/gist\.github\.com\/([^\/#]+)\/([0-9a-f]+)/i);
  if(!m) return null;
  return 'https://gist.githubusercontent.com/'+m[1]+'/'+m[2]+'/raw/fileos-cloud-backup.json';
}

async function loadLink(){
  const link=(localStorage.getItem(KEY_LINK)||'').trim();
  if(!link){ toast('请先在设置里填 Gist 链接'); $('dlg').showModal(); return; }
  const url=rawUrlFrom(link);
  if(!url){ toast('链接格式不对'); return; }
  toast('正在读取…');
  try{
    const r=await fetch(url,{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    applyJson(await r.text(),'Gist 链接');
  }catch(e){ toast('读取失败：'+e.message+'\n可在设置里用「导入 JSON 文件」'); }
}

function boot(){
  const cache=localStorage.getItem(KEY_CACHE);
  if(cache){ try{ const o=JSON.parse(cache); data=o.data; curClass=o.class||curClass; source='本地缓存'; }catch(e){} }
  render();
  if(localStorage.getItem(KEY_LINK)) loadLink();
}

$('btnRefresh').onclick=loadLink;
$('btnSet').onclick=()=>{ $('inLink').value=localStorage.getItem(KEY_LINK)||''; $('dlg').showModal(); };
$('btnClose').onclick=()=>$('dlg').close();
$('btnSaveLink').onclick=()=>{ localStorage.setItem(KEY_LINK,$('inLink').value.trim()); $('dlg').close(); loadLink(); };
$('btnClear').onclick=()=>{ localStorage.removeItem(KEY_CACHE); data=null; source=''; render(); toast('缓存已清除'); };
$('inFile').onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  const fr=new FileReader();
  fr.onload=()=>{ applyJson(String(fr.result),'本地文件'); $('dlg').close(); };
  fr.readAsText(f,'utf-8');
};
boot();
</script>
</body>
</html>
